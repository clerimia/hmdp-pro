# Prometheus 抓取配置（本地开发用）
#
# 抓的是宿主机上跑的应用（不是容器内的）：容器内访问宿主机用 host.docker.internal，
# Linux 下靠 compose 里的 extra_hosts: host-gateway 映射到宿主机网关。
#
# 改完配置不用重启容器：
#   docker compose exec prometheus promtool check config /etc/prometheus/prometheus.yml
#   curl -X POST http://localhost:9090/-/reload        （已开 --web.enable-lifecycle）

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: hmdp-pro
    # 秒杀是短时高频场景，采密一点才能看见洪峰形状
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: /actuator/prometheus
    static_configs:
      # application 标签由应用侧 management.metrics.tags.application 自带，
      # 这里不要再写一遍，否则与指标自带标签冲突
      - targets: ['host.docker.internal:8081']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
