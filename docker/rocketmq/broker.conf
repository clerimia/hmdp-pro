# RocketMQ Broker 配置（本地开发用，单机单 Master）
#
# 关键点：brokerIP1 必须写宿主机能连上的地址。
# 客户端（跑在宿主机上的应用）先从 namesrv 拿到 broker 地址，再去连这个地址。
# 如果留空，broker 上报的是容器内网 IP（172.x.x.x），宿主机连不上 —— 表现为
# "connect to 172.x.x.x:10911 failed"，这是 Docker 部署 RocketMQ 最常见的坑。
# 这里配合 compose 的端口映射 10911:10911，写 127.0.0.1 即可打通。
#
# 若你把应用也放进容器跑（同 compose 网络内），则要把 brokerIP1 改成服务名
# rocketmq-broker，此时客户端连的是容器名而不是 127.0.0.1。

brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 与容器内服务名一致（broker 自己访问 namesrv 走容器网络）
namesrvAddr = rocketmq-namesrv:9876

# 上报给客户端的地址：宿主机可达
brokerIP1 = 127.0.0.1

# 开发便利：Topic 不存在时自动创建（生产环境务必关掉）
autoCreateTopicEnable = true

# 秒杀用的是事务消息，回查靠这个线程池，给足线程避免回查积压
transactionCheckMax = 5
transactionCheckInterval = 10000
