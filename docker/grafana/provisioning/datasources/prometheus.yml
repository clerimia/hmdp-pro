apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid 被 dashboard JSON 引用，改这里要同步改 dashboards/hmdp-seckill.json
    uid: hmdp-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
