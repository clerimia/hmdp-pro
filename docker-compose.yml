# hmdp-pro 依赖中间件（MySQL / Redis）
#
# 用法：
#   docker compose up -d                 # 全量启动
#   docker compose up -d mysql           # 只起数据库
#   docker compose logs -f mysql         # 看初始化日志（首次会导入 db/ 下的 SQL）
#   docker compose down                  # 停止并移除容器（数据卷保留）
#   docker compose down -v               # 连数据卷一起删（下次启动重新跑初始化）
#
# 注意：
#   1. 宿主机 3306 已被本机 MySQL 服务占用，容器内 3306 映射到宿主机 3307。
#      应用连接请改 url 端口，或停掉本机 MySQL 后把映射改回 3306:3306。
#   2. /docker-entrypoint-initdb.d 只在数据卷为空的首次启动执行，按文件名升序导入：
#        hmdp-schema.sql  → 建表
#        hmdp-seed-data.sql → 种子数据
#        worker_node.sql    → UidGenerator worker 节点表
#      改了 SQL 想重跑，必须先 `docker compose down -v`。

services:
  mysql:
    image: mysql:8.0
    # 不写死 container_name：避免与工作区副本（E:/Project/hmdp-pro）里的 hmdp-mysql 撞名
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command:
      # mysql_native_password：项目 mysql-connector 5.1.47 不支持 8.0 默认的 caching_sha2_password
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  redis-data:
