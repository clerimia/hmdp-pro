# hmdp-pro 依赖中间件（MySQL / Redis / RocketMQ / Prometheus / Grafana）
#
# 常用命令：
#   docker compose up -d                 # 全量启动
#   docker compose up -d mysql redis     # 只起业务中间件（观测栈可选，互不依赖）
#   docker compose down -v               # 连数据卷一起删（改了 db/ 下的 SQL 后必须这样重跑初始化）
#
# 注意：
#   1. 宿主机 3306 被本机 MySQL 占用，映射到 3307，应用连接 url 需同步改端口
#   2. /docker-entrypoint-initdb.d 仅在数据卷为空的首次启动执行（schema → seed → worker_node 按文件名序）
#   3. Prometheus 抓宿主机应用（host.docker.internal:8081），应用须在宿主机运行才有数据。
#      端口：9090=Prometheus、3000=Grafana（admin/admin，被占用就改映射）

services:
  mysql:
    image: mysql:8.0
    # 不写死 container_name：避免与工作区副本里的 hmdp-mysql 撞名
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command:
      # mysql-connector 5.1.47 不支持 8.0 默认的 caching_sha2_password
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # volatile-lru 而非 allkeys-lru：seckill:stock:* / seckill:order:* 无 TTL，绝不能被驱逐
    # （库存被逐 = 凭空消失；若再按落后的 DB 值回填会超卖）。其余 key 都带 TTL，是天然淘汰候选。
    # 生产加固：不可丢数据拆独立实例 + noeviction + 合理 maxmemory
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    # Linux 下靠 host-gateway 让容器解析宿主机（Docker Desktop 亦然）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      # ── SMTP 发信（告警邮件出口）─────────────────────────────────────
      # QQ 邮箱示例：设置 → 账号 → 开启 IMAP/SMTP 服务 → 生成授权码（填授权码，非登录密码）
      # 163 邮箱：GF_SMTP_HOST=smtp.163.com:465；Gmail：smtp.gmail.com:587 + 应用专用密码
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.qq.com:465
      GF_SMTP_USER: REPLACE_ME@qq.com
      GF_SMTP_PASSWORD: REPLACE_ME_AUTH_CODE
      GF_SMTP_FROM_ADDRESS: REPLACE_ME@qq.com
      GF_SMTP_FROM_NAME: hmdp-pro-alert
      GF_SMTP_SKIP_VERIFY: "true"
    volumes:
      # provisioning 自动导入数据源与面板，起容器即可用
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 版本与 pom.xml 的 rocketmq-client 保持一致（4.9.7），跨大版本可能协议不兼容
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    ports:
      - "9876:9876"
    environment:
      # 堆显式压小（开发机）；-XX:-UseContainerSupport 见 broker 注释
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m -XX:-UseContainerSupport"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # -XX:-UseContainerSupport 是必需项：镜像自带 JDK 8u372 在 Docker Desktop(WSL2) cgroup v2 下
      # 探测抛 NPE → 消费全部 NoClassDefFoundError 且 broker 无 ERROR 日志，表现为「能发不能收」
      # （producer 全部成功、offset 正常、consumer 一条收不到）。堆已显式固定，关闭容器感知无副作用
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m -XX:-UseContainerSupport"
    # command 必须用数组形式：字符串形式会被整体当成单个参数（无日志退出 253）
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    # store 只能用 tmpfs（uid=3000 必须显式指定）：
    #   - 挂载卷一律退出 253：RocketMQ 的 commitlog mmap 不被 Docker Desktop 卷支持
    #     （已排除 cgroup bug / 卷属主两个假设，勿重复排查）
    #   - 不指定 uid 时 tmpfs 由 root 创建 → broker 卡 store/lock 权限后退出 253，
    #     stdout 正常、真异常只在容器内 broker.log（Failed to initialize），极具迷惑性
    #   - 代价：broker 重启丢 topic/位点/消息 → 之后必须重启应用（消费者会因 topic 不存在丢前几单）
    tmpfs:
      - /home/rocketmq/store:uid=3000,gid=3000
    depends_on:
      - rocketmq-namesrv
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  rocketmq-namesrv-data:
