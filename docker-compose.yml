# hmdp-pro 依赖中间件（MySQL / Redis）
#
# 用法：
#   docker compose up -d                 # 全量启动
#   docker compose up -d mysql           # 只起数据库
#   docker compose logs -f mysql         # 看初始化日志（首次会导入 db/ 下的 SQL）
#   docker compose down                  # 停止并移除容器（数据卷保留）
#   docker compose down -v               # 连数据卷一起删（下次启动重新跑初始化）
#
# 注意：
#   1. 宿主机 3306 已被本机 MySQL 服务占用，容器内 3306 映射到宿主机 3307。
#      应用连接请改 url 端口，或停掉本机 MySQL 后把映射改回 3306:3306。
#   2. /docker-entrypoint-initdb.d 只在数据卷为空的首次启动执行，按文件名升序导入：
#        hmdp-schema.sql  → 建表
#        hmdp-seed-data.sql → 种子数据
#        worker_node.sql    → UidGenerator worker 节点表
#      改了 SQL 想重跑，必须先 `docker compose down -v`。
#   3. prometheus / grafana 是可选的观测栈，与业务中间件互不依赖：
#        docker compose up -d mysql redis prometheus grafana
#      只起中间件就 `docker compose up -d mysql redis`。
#      Prometheus 抓的是**宿主机**上的应用（host.docker.internal:8081），
#      不是容器内的应用，所以应用要在宿主机跑起来才有数据。
#      端口：9090=Prometheus、3000=Grafana（admin/admin）。
#      3000 若被前端 dev server 占用，把映射改成 "3001:3000"。

services:
  mysql:
    image: mysql:8.0
    # 不写死 container_name：避免与工作区副本（E:/Project/hmdp-pro）里的 hmdp-mysql 撞名
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: hmdp
      TZ: Asia/Shanghai
    command:
      # mysql_native_password：项目 mysql-connector 5.1.47 不支持 8.0 默认的 caching_sha2_password
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # maxmemory-policy 说明：
    #   默认 noeviction 在内存打满后直接拒绝写（登录/秒杀全挂），必须显式配。
    #   本实例以缓存为主（商铺缓存 / 空值标记都带 TTL），选 allkeys-lru：
    #   内存压力下优先驱逐最久未访问的 key，缓存被逐最多回源 DB，语义无损。
    #   注意：秒杀库存等 key 也可能被逐，本地开发可接受；生产若把
    #   「不可丢」数据放缓存实例，应拆实例并配 noeviction + 合理 maxmemory。
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    # 让容器能解析 host.docker.internal → 宿主机（Linux 靠 host-gateway，Docker Desktop 亦然）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      # provisioning 目录自动导入数据源与面板，起容器即可用，不用手点
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 版本与 pom.xml 里的 rocketmq-client 保持一致（4.9.7），
  # 客户端与 Broker 跨大版本可能出现协议不兼容
  rocketmq-namesrv:
    image: apache/rocketmq:4.9.7
    ports:
      - "9876:9876"
    environment:
      # 默认 JVM 堆太大，开发机扛不住，显式压下来
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqnamesrv
    volumes:
      - rocketmq-namesrv-data:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-broker:
    image: apache/rocketmq:4.9.7
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms1g -Xmx1g -Xmn512m"
    # 用数组形式：字符串形式可能被整体当成单个参数（表现为无日志退出 253）
    # brokerIP1 的取值见 docker/rocketmq/broker.conf 顶部注释
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    # store 必须用 tmpfs，不能挂数据卷：
    # RocketMQ 用 mmap 读写 commitlog，Docker Desktop 的挂载卷（gRPC-FUSE）不支持，
    # 表现为 broker 无日志退出 253 —— 排查了很久才定位到，别再改回数据卷。
    # 代价是重启后消息丢失，本地开发无所谓。
    tmpfs:
      - /home/rocketmq/store
    depends_on:
      - rocketmq-namesrv
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'echo > /dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  rocketmq-namesrv-data:
