[pytest]
# 只放 pytest 自身配置：业务配置一律走 config/*.yaml（见 common/config.py）。
testpaths = testcases
pythonpath = .

markers =
    slow: 含 TTL/熔断恢复等确定性长等待的用例（>10s，等待的是配置常量不是碰运气）
    serial: 共享同一张券/同一批用户的用例，pytest-xdist 并行时必须排除
    chaos: 会阻塞全局 Redis 的故障注入用例（DEBUG SLEEP / 停容器），禁止与其他流量并发
    isolate: 需要指标窗口隔离的用例，断言窗口内不做任何其他请求

# 红线（docs/plans/2026-09-05-pytest-framework-structure.md §6）：
# 1. rerunfailures 只能全局配 --reruns=1 --reruns-delay=1，禁止给单条用例加 flaky 标记——
#    重试是网络抖动的兜底，不是掩盖 wait_until 写错的遮羞布；
# 2. 写了 sleep 的地方该改成 wait_until，不该加重试。
addopts = -ra --strict-markers --reruns=1 --reruns-delay=1
