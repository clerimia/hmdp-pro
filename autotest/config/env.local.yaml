# 本机环境（入库，无敏感信息；密码走环境变量，文件里不落）
base_url: "http://127.0.0.1:8081"
# 抢券链路跑 JMeter/网关限流场景时切到 OpenResty 入口：http://127.0.0.1（80 → proxy 8081），
# 网关令牌桶 rate=1000/s，pytest 功能用例量级（<100 rps）够不着桶限。

mysql:
  host: 127.0.0.1
  port: 3307                # 容器 3306 → 宿主机 3307（docker-compose.yml 端口映射）
  user: ${HMDP_DB_USER:-root}
  password: ${HMDP_DB_PASSWORD:-}   # 真正的值走环境变量，文件里不落
  database: hmdp
  charset: utf8mb4

redis:
  host: 127.0.0.1
  port: 6379
  db: 0

prometheus: "http://127.0.0.1:9090"   # Prometheus 服务端（备选抓取源；默认直接打应用 /actuator/prometheus）
