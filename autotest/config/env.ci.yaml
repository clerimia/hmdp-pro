# CI 环境：host 用 compose 服务名，端口回到容器内网口。
# 注意：CI 平台尚未选定（GitHub Actions 能否起 docker-compose 未验证，见框架结构票 §9），
# 本文件是占位形态，落地 CI 时按实际拓扑改。
base_url: "http://127.0.0.1:8081"

mysql:
  host: mysql
  port: 3306
  user: ${HMDP_DB_USER:-root}
  password: ${HMDP_DB_PASSWORD:-}
  database: hmdp
  charset: utf8mb4

redis:
  host: redis
  port: 6379
  db: 0

prometheus: "http://prometheus:9090"
